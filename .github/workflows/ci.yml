name: yong-planner-quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: check-lockfile
        run: |
          if [ ! -f yarn.lock ]; then
            echo "::error::Run yarn install with Yarn 1.22.22 and commit yarn.lock before running CI."
            exit 1
          fi

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: setup-yarn-classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: install-dependencies
        run: yarn install --frozen-lockfile

      - name: lint
        run: yarn lint

      - name: format-check
        run: yarn format:check

      - name: typecheck
        run: yarn typecheck
