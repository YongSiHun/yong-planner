name: yong-planner-ios

run-name: yong-planner-ios-build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch
        required: true
        default: main

      environment:
        description: Environments
        type: choice
        options:
          - production
          - preview
          - development
        default: production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: check-build-configuration
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set the repository secret EXPO_TOKEN."
            exit 1
          fi
          if [ ! -f yarn.lock ]; then
            echo "::error::Run yarn install with Yarn 1.22.22 and commit yarn.lock before building."
            exit 1
          fi

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: setup-yarn-classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          test "$(yarn --version)" = "1.22.22"

      - name: install-dependencies
        run: |
          npm install -g eas-cli@27.2.0
          yarn install --frozen-lockfile

      - name: quality-checks
        run: |
          yarn lint
          yarn format:check
          yarn typecheck
          yarn test

      - name: versioning
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          BUILD=$((100 + ${{ github.run_number }}))

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

          echo "Version: $VERSION"
          echo "Build: $BUILD"

      - name: build-ipa-local
        env:
          BUILD: ${{ env.BUILD }}
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          eas build \
            -p ios \
            --profile ${{ github.event.inputs.environment }} \
            --local \
            --non-interactive

          IPA=$(find . -type f -name "*.ipa" | xargs ls -t | head -n 1)

          if [ -z "$IPA" ]; then
            echo "IPA not found"
            exit 1
          fi

          echo "Found: $IPA"

          cp "$IPA" \
            "yong-planner-${VERSION}-${BUILD}-${{ github.event.inputs.environment }}.ipa"

      - name: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}-ios
          path: |
            yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}.ipa
