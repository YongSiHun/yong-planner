name: yong-planner-ios

run-name: yong-planner-ios-build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch
        required: true
        default: main

      environment:
        description: Environments
        type: choice
        options:
          - production
          - preview
          - development
        default: production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          cache: yarn

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: install-dependencies
        run: |
          npm install -g yarn@1.22.22 eas-cli
          yarn install --frozen-lockfile

      - name: versioning
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          BUILD=$((100 + ${{ github.run_number }}))

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

          echo "Version: $VERSION"
          echo "Build: $BUILD"

      - name: build-ipa-local
        env:
          BUILD: ${{ env.BUILD }}
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          eas build \
            -p ios \
            --profile ${{ github.event.inputs.environment }} \
            --local \
            --non-interactive

          IPA=$(find . -type f -name "*.ipa" | xargs ls -t | head -n 1)

          if [ -z "$IPA" ]; then
            echo "IPA not found"
            exit 1
          fi

          echo "Found: $IPA"

          cp "$IPA" \
            "yong-planner-${VERSION}-${BUILD}-${{ github.event.inputs.environment }}.ipa"

      - name: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}-ios
          path: |
            yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}.ipa
