name: yong-planner-ios

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch
        required: true
        default: main

      environment:
        description: Environments
        type: choice
        options:
          - production
          - preview
          - development
        default: production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          cache: yarn

      - name: prepare-build
        run: |
          npm install -g yarn@1.22.22 eas-cli@27.2.0
          yarn install --frozen-lockfile

      - name: build-ios
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          export BUILD=$((100 + GITHUB_RUN_NUMBER))
          VERSION=$(npx expo config --json | jq -r '.version')
          PREFIX="yong-planner-${VERSION}-${BUILD}-${ENVIRONMENT}"
          echo "ARTIFACT_NAME=${PREFIX}-ios" >> "$GITHUB_ENV"
          mkdir -p artifacts
          OUTPUT="artifacts/${PREFIX}.ipa"
          eas build -p ios --profile "$ENVIRONMENT" --local --non-interactive --output "$OUTPUT"
          test -s "$OUTPUT"

      - name: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/*
          if-no-files-found: error
