name: yong-planner-android

run-name: yong-planner-android-build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch
        required: true
        default: main

      environment:
        description: Environments
        type: choice
        options:
          - production
          - preview
          - development
        default: production

      build_type:
        description: Build Type
        type: choice
        options:
          - both
          - apk
          - aab
        default: both

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: cache-gradle-wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: install-dependencies
        run: |
          npm install -g eas-cli@27.2.0
          yarn install --frozen-lockfile

      - name: versioning
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          BUILD=$((100 + ${{ github.run_number }}))

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

          echo "Version: $VERSION"
          echo "Build: $BUILD"

      - name: build-aab-local
        if: github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both'
        env:
          BUILD: ${{ env.BUILD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g'"
        run: |
          PROFILE="${{ github.event.inputs.environment }}"
          if [ "$PROFILE" = "development" ]; then
            PROFILE="development-aab"
          fi

          eas build \
            -p android \
            --profile "$PROFILE" \
            --local \
            --non-interactive

          AAB=$(find . -type f -name "*.aab" | xargs ls -t | head -n 1)

          if [ -z "$AAB" ]; then
            echo "AAB not found"
            exit 1
          fi

          echo "Found: $AAB"

          cp "$AAB" \
            "yong-planner-${VERSION}-${BUILD}-${{ github.event.inputs.environment }}.aab"

      - name: build-apk-local
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both'
        env:
          BUILD: ${{ env.BUILD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g'"
        run: |
          eas build \
            -p android \
            --profile ${{ github.event.inputs.environment }}-apk \
            --local \
            --non-interactive

          APK=$(find . -type f -name "*.apk" | xargs ls -t | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "Found: $APK"

          cp "$APK" \
            "yong-planner-${VERSION}-${BUILD}-${{ github.event.inputs.environment }}.apk"

      - name: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}-and
          path: |
            yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}.aab
            yong-planner-${{ env.VERSION }}-${{ env.BUILD }}-${{ github.event.inputs.environment }}.apk
