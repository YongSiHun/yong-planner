name: yong-planner-android

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch
        required: true
        default: main

      environment:
        description: Environments
        type: choice
        options:
          - production
          - preview
          - development
        default: production

      build_type:
        description: Build Type
        type: choice
        options:
          - both
          - apk
          - aab
        default: both

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: setup-nodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 26.13.1
          cache: yarn

      - name: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: setup-android-sdk
        uses: android-actions/setup-android@v4

      - name: prepare-build
        run: |
          npm install -g yarn@1.22.22 eas-cli@27.2.0
          yarn install --frozen-lockfile
          sdkmanager --list --channel=0 > "$RUNNER_TEMP/android-sdk-list.txt"
          node scripts/android-sdk-packages.cjs < "$RUNNER_TEMP/android-sdk-list.txt" > "$RUNNER_TEMP/android-sdk-packages.txt"
          sdkmanager --package_file="$RUNNER_TEMP/android-sdk-packages.txt"

      - name: build-android
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_TYPE: ${{ inputs.build_type }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g'"
        run: |
          export BUILD=$((100 + GITHUB_RUN_NUMBER))
          VERSION=$(npx expo config --json | jq -r '.version')
          PREFIX="yong-planner-${VERSION}-${BUILD}-${ENVIRONMENT}"
          echo "ARTIFACT_NAME=${PREFIX}-and" >> "$GITHUB_ENV"
          mkdir -p artifacts

          for TYPE in aab apk; do
            if [[ "$BUILD_TYPE" != both && "$BUILD_TYPE" != "$TYPE" ]]; then
              continue
            fi

            PROFILE="$ENVIRONMENT"
            if [[ "$TYPE" == apk || "$ENVIRONMENT" == development ]]; then
              PROFILE="${ENVIRONMENT}-${TYPE}"
            fi
            OUTPUT="artifacts/${PREFIX}.${TYPE}"
            eas build -p android --profile "$PROFILE" --local --non-interactive --output "$OUTPUT"
            test -s "$OUTPUT"
          done

      - name: upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/*
          if-no-files-found: error
